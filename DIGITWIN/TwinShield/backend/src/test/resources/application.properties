# Server Settings
server.port=8080
spring.application.name=twinshield-backend-test

# Datasource Configuration (In-Memory Database for Clean Parallel Unit Testing)
spring.datasource.url=jdbc:h2:mem:twinshield_testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console Configuration
spring.h2.console.enabled=false

# JPA / Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Defer SQL script initialization
spring.jpa.defer-datasource-initialization=true

# Logging
logging.level.root=INFO
logging.level.com.twinshield.backend=INFO
