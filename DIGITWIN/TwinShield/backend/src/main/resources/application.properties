# Server Settings
server.port=8080
spring.application.name=twinshield-backend

# MySQL Datasource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/twinshield_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=Malu@2007

# JPA / Hibernate Properties for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# SQL script initialization
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Logging
logging.level.root=INFO
logging.level.com.twinshield.backend=INFO
