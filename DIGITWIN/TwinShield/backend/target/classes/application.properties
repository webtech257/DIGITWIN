# Server Settings
server.port=8080
spring.application.name=twinshield-backend

# Datasource Configuration (File-based Disk Persistent Database)
spring.datasource.url=jdbc:h2:file:./data/twinshield_db;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console Configuration (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Defer SQL script initialization
spring.jpa.defer-datasource-initialization=true

# Logging
logging.level.root=INFO
logging.level.com.twinshield.backend=INFO
